name: Run Finalize Audit Fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run finalize_audit_fixes.py
        run: python scripts/finalize_audit_fixes.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Apply post-migration audit fixes and rebuild sitemap.xml"
            git push
          else
            echo "No changes to commit."
          fi

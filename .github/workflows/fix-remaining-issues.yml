name: Fix Remaining Site Issues

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
     
      - name: Rewrite stale /blog/ links to hub URLs
        run: python scripts/fix_old_blog_links.py

      - name: Run cleanup & HTML integrity audit
        run: python scripts/fix_remaining_issues.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: clean JSON-LD entities and refresh November 2026 dates"
            git push
          fi

name: Automated Google Indexing

on:
  push:
    branches:
      - main
    paths:
      - 'blog/**'
      - 'sitemap.xml'
  workflow_dispatch:

jobs:
  indexing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Push URLs to Google Indexing API
        uses: robingenz/action-google-indexing@v1.1.0
        with:
          credentialsJson: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          siteUrl: 'https://www.savingstactic.com/'

name: Broken Link Checker

on:
  push:
    branches:
      - main
    paths:
      - 'blog/**'
      - '*.html'
  schedule:
    - cron: '0 0 * * 0' # Automatically runs every Sunday at midnight
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore Lychee Cache
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: ${{ runner.os }}-lychee-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lychee-

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2.3.0
        with:
          args: --verbose --no-progress './**/*.html'
          fail: false

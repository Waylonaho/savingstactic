name: Build, Optimize & Update Sitemap
on:
  push:
    branches:
      - main
    paths:
      - 'blog/**'

permissions:
  contents: write

jobs:
  build-and-optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Python Optimization & Sitemap Script
        run: python generate_sitemap.py

      - name: Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/ sitemap.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-optimize blog files and update sitemap [skip ci]" && git push)

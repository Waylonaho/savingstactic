name: Generate Repository Dump

on:
  workflow_dispatch:

jobs:
  create-dump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Dump Script
        run: python dump.py

      - name: Upload Dump File as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-repo-dump
          path: full_repo_dump.txt
